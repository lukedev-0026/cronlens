[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cronlens"
dynamic = ["version"]
description = "Find broken, colliding and daylight-saving-sensitive cron schedules across crontabs, Kubernetes CronJobs and GitHub Actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Taaffe", email = "luke.taaffe0026@gmail.com" }]
requires-python = ">=3.11"
keywords = ["cron", "crontab", "kubernetes", "github-actions", "linter", "dst", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0.1",
    "tzdata>=2024.1",
]

[project.scripts]
cronlens = "cronlens.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.7",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20250516",
    "pip-audit==2.9.0",
]

[tool.hatch.version]
path = "src/cronlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cronlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
