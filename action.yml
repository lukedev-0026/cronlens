name: cronlens
description: Check cron schedules in crontabs, Kubernetes CronJobs and GitHub Actions workflows.
author: Luke Taaffe
branding:
  icon: clock
  color: blue

inputs:
  paths:
    description: Space-separated paths to scan.
    default: "."
  fail-on:
    description: Lowest severity that fails the step (error, warning, info or never).
    default: warning
  sarif-file:
    description: If set, also write a SARIF report to this path for upload to code scanning.
    default: ""
  args:
    description: Extra arguments passed to `cronlens scan`.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install cronlens
      shell: bash
      run: python -m pip install --disable-pip-version-check "${GITHUB_ACTION_PATH}"
    - name: Write SARIF report
      if: inputs.sarif-file != ''
      shell: bash
      env:
        CRONLENS_PATHS: ${{ inputs.paths }}
        CRONLENS_SARIF: ${{ inputs.sarif-file }}
        CRONLENS_ARGS: ${{ inputs.args }}
      # Word splitting of the paths and args variables is intended.
      run: cronlens scan $CRONLENS_PATHS $CRONLENS_ARGS --format sarif --output "$CRONLENS_SARIF" --fail-on never
    - name: Scan schedules
      shell: bash
      env:
        CRONLENS_PATHS: ${{ inputs.paths }}
        CRONLENS_FAIL_ON: ${{ inputs.fail-on }}
        CRONLENS_ARGS: ${{ inputs.args }}
      run: cronlens scan $CRONLENS_PATHS $CRONLENS_ARGS --fail-on "$CRONLENS_FAIL_ON"
